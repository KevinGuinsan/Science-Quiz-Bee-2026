<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quiz Bee Portal</title>
  <style>
    body { font-family: -apple-system, sans-serif; background: #eef2f5; padding: 20px; max-width: 800px; margin: auto; }
    .card { background: white; padding: 24px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
    .btn { display: inline-block; width: 100%; padding: 14px; font-weight: bold; text-align: center; border-radius: 8px; text-decoration: none; box-sizing: border-box; }
    .btn-player { background: #198754; color: white; font-size: 1.2rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin-top: 15px; }
    .btn-host { background: #0d6efd; color: white; }
  </style>
</head>
<body>

  <div style="text-align: center; margin-bottom: 25px;">
    <h1>🏆 Quiz Bee Portal</h1>
    <p>Low-Latency Real-Time Classroom Quiz Platform</p>
  </div>

  <div class="card" style="border-left: 6px solid #198754;">
    <h2>📱 Student Entrance</h2>
    <br>
    <a href="./player.html" class="btn btn-player">Open Student Screen</a>
  </div>

  <div class="card">
    <h2>🎙️ Host Launchers (Teachers)</h2>
    <div class="grid">
      <a href="./grade7/" class="btn btn-host">Grade 7 Host</a>
      <a href="./grade10/" class="btn btn-host">Grade 10 Host</a>
      <a href="./grade11/" class="btn btn-host">Grade 11 Host</a>
      <a href="./grade12/" class="btn btn-host">Grade 12 Host</a>
    </div>
  </div>

</body>
</html>
