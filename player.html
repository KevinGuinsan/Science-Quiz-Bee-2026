<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quiz Bee Student Screen</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    body { font-family: -apple-system, sans-serif; background: #f4f6f9; padding: 20px; max-width: 500px; margin: auto; }
    .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
    input { width: 100%; padding: 12px; margin-bottom: 12px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 1rem; }
    button { width: 100%; padding: 14px; font-size: 1.1rem; font-weight: bold; background: #0d6efd; color: white; border: none; border-radius: 8px; margin-bottom: 10px; cursor: pointer; }
    .option-btn { background: #e9ecef; color: #212529; }
    .option-btn:active { background: #ffc107; }
    .timer { font-size: 1.5rem; color: #dc3545; font-weight: bold; text-align: center; margin-bottom: 15px; }
  </style>
</head>
<body>

  <div class="card" id="join-screen">
    <h2>🏆 Join Quiz Bee</h2>
    <input type="text" id="room-input" placeholder="Enter Room Code (e.g., 4821)" />
    <input type="text" id="name-input" placeholder="Enter Your Full Name" />
    <button onclick="joinGame()">Join Session</button>
  </div>

  <div class="card" id="game-screen" style="display: none;">
    <div id="timer-display" class="timer">Waiting for Host...</div>
    <h3 id="question-text">Waiting for next question...</h3>
    <br>
    <div id="options-container"></div>
  </div>

  <script>
    let peer = null;
    let hostConn = null;

    function joinGame() {
      const roomCode = document.getElementById('room-input').value.trim();
      const playerName = document.getElementById('name-input').value.trim();

      if (!roomCode || !playerName) return alert("Please enter both Room Code and Name!");

      peer = new Peer();

      peer.on('open', () => {
        hostConn = peer.connect(roomCode, { metadata: { name: playerName } });

        hostConn.on('open', () => {
          document.getElementById('join-screen').style.display = 'none';
          document.getElementById('game-screen').style.display = 'block';
        });

        hostConn.on('data', (data) => {
          if (data.type === 'NEW_QUESTION') renderQuestion(data.payload);
          if (data.type === 'TIMER_SYNC') document.getElementById('timer-display').innerText = `${data.payload.timeLeft}s`;
          if (data.type === 'TIME_UP') lockButtons();
        });
      });
    }

    function renderQuestion(payload) {
      document.getElementById('timer-display').innerText = `${payload.timeLimit}s`;
      document.getElementById('question-text').innerText = payload.question;
      const container = document.getElementById('options-container');
      container.innerHTML = '';

      payload.options.forEach((optText, index) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerText = optText;
        btn.disabled = false; // Mobile state unlock fix
        btn.onclick = () => submitAnswer(index, btn);
        container.appendChild(btn);
      });
    }

    function submitAnswer(index, btnEl) {
      hostConn.send({ type: 'SUBMIT_ANSWER', answerIndex: index });
      lockButtons();
      btnEl.style.background = '#ffc107';
    }

    function lockButtons() {
      const btns = document.querySelectorAll('#options-container button');
      btns.forEach(b => b.disabled = true);
    }
  </script>
</body>
</html>
