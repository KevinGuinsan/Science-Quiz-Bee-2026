<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz Bee Student Portal</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f4f6f9; color: #333; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .card { background: #ffffff; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); padding: 25px; width: 100%; max-width: 450px; }
    h1 { font-size: 1.4rem; color: #1a252f; margin-bottom: 15px; text-align: center; }
    .form-group { margin-bottom: 15px; }
    label { display: block; font-size: 0.85rem; font-weight: 600; color: #64748b; margin-bottom: 5px; }
    input[type="text"] { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 1rem; }
    input[disabled] { background-color: #f1f5f9; color: #64748b; }
    .btn { width: 100%; padding: 12px; border: none; border-radius: 6px; font-weight: 600; font-size: 1rem; cursor: pointer; background: #0066ff; color: white; transition: background 0.2s ease; }
    .btn:disabled { background: #cbd5e1; cursor: not-allowed; }
    .badge { background-color: #3498db; color: #fff; padding: 4px 10px; border-radius: 20px; font-size: 0.8rem; font-weight: 600; float: right; }
    .timer-box { font-size: 1.8rem; font-weight: bold; color: #e74c3c; font-family: monospace; text-align: center; margin: 15px 0 5px 0; }
    .options-grid { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
    .option-btn { background: #ffffff; border: 1px solid #cbd5e1; border-radius: 6px; padding: 12px; font-size: 1rem; text-align: left; cursor: not-allowed; opacity: 0.6; }
    .option-btn.active { cursor: pointer; opacity: 1; }
    .option-btn.active:hover { border-color: #0066ff; background: #f0f7fc; }
  </style>
</head>
<body>

  <div class="card">
    <div id="join-screen">
      <h1>Join Quiz Bee Room</h1>
      <form id="join-form">
        <div class="form-group">
          <label>ROOM CODE</label>
          <input type="text" id="room-input" placeholder="e.g. ABCD" maxlength="6" required style="text-transform: uppercase; font-weight: bold; letter-spacing: 2px;">
        </div>
        <div class="form-group">
          <label>FULL NAME</label>
          <input type="text" id="name-input" placeholder="e.g. Juan Cruz" required>
        </div>
        <div class="form-group">
          <label>SECTION</label>
          <input type="text" id="section-input" placeholder="e.g. 11-STEM A" required>
        </div>
        <button type="submit" id="join-btn" class="btn">Join Game</button>
      </form>
    </div>

    <div id="game-screen" style="display: none;">
      <header style="border-bottom: 1px solid #e2e8f0; padding-bottom: 10px; margin-bottom: 15px;">
        <span id="player-tag" style="font-size: 0.85rem; font-weight: bold; color: #64748b;">Player</span>
        <span id="round-tag" class="badge">EASY</span>
      </header>

      <div id="question-box" style="font-size: 1.1rem; font-weight: 600; color: #1e293b; margin-bottom: 10px;">
        Loading active question...
      </div>

      <div id="timer-display" class="timer-box">--.--s</div>

      <div id="input-container" class="options-grid"></div>
    </div>
  </div>

  <script>
    let playerUuid = localStorage.getItem('qb_pid');
    if (!playerUuid) {
      playerUuid = 'pid_' + Math.random().toString(36).substring(2, 9);
      localStorage.setItem('qb_pid', playerUuid);
    }

    let timerInterval = null;
    const urlParams = new URLSearchParams(window.location.search);
    const roomFromUrl = urlParams.get('room');

    const roomInput = document.getElementById('room-input');
    const nameInput = document.getElementById('name-input');
    const sectionInput = document.getElementById('section-input');
    const joinForm = document.getElementById('join-form');
    const joinScreen = document.getElementById('join-screen');
    const gameScreen = document.getElementById('game-screen');
    const questionBox = document.getElementById('question-box');
    const timerDisplay = document.getElementById('timer-display');
    const inputContainer = document.getElementById('input-container');

    if (roomFromUrl) {
      roomInput.value = roomFromUrl.toUpperCase();
      roomInput.readOnly = true;
      roomInput.style.backgroundColor = '#f1f5f9';
    }

    // Restore persistent session
    const savedInfo = localStorage.getItem('qb_player_info');
    if (savedInfo) {
      const playerData = JSON.parse(savedInfo);
      playerData.uuid = playerUuid;
      roomInput.value = playerData.room;
      nameInput.value = playerData.name;
      sectionInput.value = playerData.section;
      
      joinScreen.style.display = 'none';
      gameScreen.style.display = 'block';
      document.getElementById('player-tag').textContent = `${playerData.name} (${playerData.section})`;

      initPlayerSync(playerData);
    }

    joinForm.addEventListener('submit', (e) => {
      e.preventDefault();
      
      const playerData = {
        uuid: playerUuid,
        room: roomInput.value.trim().toUpperCase(),
        name: nameInput.value.trim(),
        section: sectionInput.value.trim()
      };

      localStorage.setItem('qb_player_info', JSON.stringify(playerData));

      joinScreen.style.display = 'none';
      gameScreen.style.display = 'block';
      document.getElementById('player-tag').textContent = `${playerData.name} (${playerData.section})`;

      initPlayerSync(playerData);
    });

    function initPlayerSync(player) {
      const channel = new BroadcastChannel(`qb_channel_${player.room}`);

      // Notify host of arrival and request immediate state sync
      channel.postMessage({ type: 'PLAYER_JOIN', player: player });

      channel.onmessage = (event) => {
        const msg = event.data;

        if (msg.type === 'QUESTION_DISPATCH') {
          clearInterval(timerInterval);
          renderQuestion(msg.question);
          timerDisplay.textContent = `${(msg.question.timer || 15).toFixed(2)}s`;
        } else if (msg.type === 'START_TIMER') {
          renderQuestion(msg.question);
          startPlayerCountdown(msg.endTime);
        }
      };
    }

    function renderQuestion(q) {
      if (!q) return;
      
      document.getElementById('round-tag').textContent = q.round ? q.round.replace(" Round", "") : "QUESTION";
      questionBox.textContent = q.question;
      inputContainer.innerHTML = '';

      if (q.type === 'mc' && q.options) {
        q.options.forEach((opt, idx) => {
          const btn = document.createElement('button');
          btn.className = 'option-btn';
          btn.textContent = `${String.fromCharCode(65 + idx)}. ${opt}`;
          btn.disabled = true; // Stay locked until host clicks Start Timer
          inputContainer.appendChild(btn);
        });
      } else if (q.type === 'text' || !q.options) {
        const input = document.createElement('input');
        input.type = 'text';
        input.id = 'typed-answer';
        input.placeholder = 'Wait for timer to start...';
        input.disabled = true;

        const submitBtn = document.createElement('button');
        submitBtn.className = 'btn';
        submitBtn.style.marginTop = '10px';
        submitBtn.textContent = 'Submit Answer';
        submitBtn.disabled = true;

        inputContainer.appendChild(input);
        inputContainer.appendChild(submitBtn);
      }
    }

    function startPlayerCountdown(endTime) {
      const optionBtns = inputContainer.querySelectorAll('.option-btn');
      const textInput = document.getElementById('typed-answer');
      const submitBtn = inputContainer.querySelector('.btn');

      // Unlock input options when timer starts
      if (optionBtns.length > 0) {
        optionBtns.forEach((btn, idx) => {
          btn.disabled = false;
          btn.classList.add('active');
          btn.onclick = () => {
            optionBtns.forEach(b => b.style.border = '1px solid #cbd5e1');
            btn.style.border = '2px solid #0066ff';
            submitResponse(idx);
          };
        });
      } else if (textInput && submitBtn) {
        textInput.disabled = false;
        textInput.placeholder = 'Type your answer here...';
        textInput.focus();
        submitBtn.disabled = false;
        submitBtn.onclick = () => {
          submitResponse(textInput.value.trim());
          submitBtn.disabled = true;
          textInput.disabled = true;
        };
      }

      // Synchronized 30ms millisecond countdown
      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        const remaining = Math.max(0, endTime - Date.now());
        timerDisplay.textContent = `${(remaining / 1000).toFixed(2)}s`;

        if (remaining <= 0) {
          clearInterval(timerInterval);
          timerDisplay.textContent = "0.00s (TIME'S UP)";
          
          optionBtns.forEach(b => {
            b.disabled = true;
            b.classList.remove('active');
          });
          if (textInput) textInput.disabled = true;
          if (submitBtn) submitBtn.disabled = true;
        }
      }, 30);
    }

    function submitResponse(answer) {
      const playerInfo = JSON.parse(localStorage.getItem('qb_player_info'));
      const channel = new BroadcastChannel(`qb_channel_${playerInfo.room}`);
      channel.postMessage({
        type: 'SUBMIT_ANSWER',
        uuid: playerUuid,
        answer: answer
      });
    }
  </script>
</body>
</html>
