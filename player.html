<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Quiz Bee - Player Controller</title>
  
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      margin: 0; padding: 20px; background-color: #f4f6f9;
      display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh;
    }
    .card {
      background: #ffffff; padding: 25px; border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 450px; text-align: center;
    }
    h2, h3 { margin-top: 0; color: #333; }
    input[type="text"] {
      width: 100%; padding: 12px; margin: 6px 0; border: 2px solid #ddd;
      border-radius: 8px; font-size: 1rem; text-align: center; box-sizing: border-box;
    }
    #roomCodeInput { text-transform: uppercase; letter-spacing: 2px; font-weight: bold; }
    input[type="text"]:focus { border-color: #007bff; outline: none; }
    button {
      width: 100%; padding: 14px; margin: 8px 0; border: none; border-radius: 8px;
      font-size: 1rem; font-weight: bold; cursor: pointer; transition: background 0.2s;
    }
    .btn-primary { background-color: #007bff; color: #fff; }
    .btn-primary:active { background-color: #0056b3; }
    .btn-secondary { background-color: #28a745; color: #fff; }
    .btn-option {
      background-color: #eef2f5; color: #333; font-size: 1.1rem;
      border: 2px solid #ccc; margin-bottom: 10px; text-align: left; padding: 14px 16px; width: 100%;
      border-radius: 8px; font-weight: 500;
    }
    .btn-option:disabled { opacity: 0.6; cursor: not-allowed; }
    
    #reader-modal {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85); z-index: 1000;
      justify-content: center; align-items: center; flex-direction: column;
    }
    #reader-box { width: 90%; max-width: 380px; background: #fff; padding: 20px; border-radius: 12px; }
    .leaderboard-box { background: #f8f9fa; padding: 12px; border-radius: 8px; margin-top: 20px; text-align: left; }
    .badge { padding: 4px 8px; border-radius: 4px; font-size: 0.8rem; color: #fff; font-weight: bold; }
    .badge-EASY { background-color: #28a745; }
    .badge-MODERATE { background-color: #ffc107; color: #212529; }
    .badge-DIFFICULT { background-color: #dc3545; }
  </style>
</head>
<body>

  <!-- JOIN SCREEN (Hides permanently after joining) -->
  <div class="card" id="join-screen">
    <h2>Join Quiz Bee</h2>
    <input type="text" id="playerNameInput" placeholder="Enter Your Full Name" />
    <input type="text" id="playerSectionInput" placeholder="Enter Your Section (e.g. 11-Newton)" />
    <input type="text" id="roomCodeInput" placeholder="4-Digit Room Code" maxlength="4" />
    <button class="btn-primary" onclick="connectToHost()">Join Room</button>
    <button class="btn-secondary" id="scanQrBtn" onclick="openQRScanner()">📷 Scan QR Code</button>
  </div>

  <!-- GAMEPLAY SCREEN -->
  <div class="card" id="game-screen" style="display: none;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
      <span id="player-tag" style="font-weight: bold; color: #666;"></span>
      <span id="category-badge" class="badge badge-EASY">EASY</span>
    </div>
    
    <h3 id="status-msg">Connected! Waiting for host...</h3>
    <h2 id="question-text" style="font-size: 1.25rem; margin: 15px 0;"></h2>

    <!-- OPTIONS -->
    <div id="options-container" style="margin-top: 15px;"></div>

    <!-- LIVE LEADERBOARD -->
    <div class="leaderboard-box">
      <h4 style="margin: 0 0 8px 0; color: #007bff;">🏆 Live Scoreboard</h4>
      <div id="player-leaderboard">Waiting for scores...</div>
    </div>
  </div>

  <!-- QR READER MODAL -->
  <div id="reader-modal">
    <div id="reader-box">
      <div id="qr-reader" style="width: 100%;"></div>
      <button onclick="closeQRScanner()" style="background:#dc3545; color:#fff; margin-top:15px; padding: 10px;">Cancel</button>
    </div>
  </div>

  <script>
    let peer = null;
    let conn = null;
    let html5QrcodeScanner = null;
    let isTimeUp = false;

    // Auto-fill room code from QR Link parameter
    window.addEventListener("DOMContentLoaded", () => {
      const urlParams = new URLSearchParams(window.location.search);
      const room = urlParams.get("room") || urlParams.get("code");
      if (room) {
        document.getElementById("roomCodeInput").value = room.trim().toUpperCase();
      }
    });

    function openQRScanner() {
      document.getElementById("reader-modal").style.display = "flex";
      html5QrcodeScanner = new Html5QrcodeScanner("qr-reader", { fps: 10, qrbox: { width: 220, height: 220 } });
      
      html5QrcodeScanner.render((decodedText) => {
        let scannedCode = decodedText;
        if (decodedText.includes("room=")) {
          try {
            const url = new URL(decodedText);
            scannedCode = url.searchParams.get("room");
          } catch(e) {}
        }
        if (scannedCode) {
          document.getElementById("roomCodeInput").value = scannedCode.trim().toUpperCase();
          closeQRScanner();
        }
      }, (error) => {});
    }

    function closeQRScanner() {
      if (html5QrcodeScanner) {
        html5QrcodeScanner.clear().catch(err => console.error(err));
      }
      document.getElementById("reader-modal").style.display = "none";
    }

    function connectToHost() {
      const name = document.getElementById("playerNameInput").value.trim();
      const section = document.getElementById("playerSectionInput").value.trim() || "N/A";
      const code = document.getElementById("roomCodeInput").value.trim().toUpperCase();

      if (!name || !code) return alert("Please enter your name and room code.");

      peer = new Peer();

      peer.on('open', (id) => {
        const hostPeerId = `quizbee-room-${code}`;
        conn = peer.connect(hostPeerId, { metadata: { name: name, section: section } });

        conn.on('open', () => {
          // Hide Join screen permanently
          document.getElementById("join-screen").style.display = "none";
          document.getElementById("game-screen").style.display = "block";
          document.getElementById("player-tag").textContent = `${name} (${section})`;
          document.getElementById("status-msg").textContent = "Connected! Waiting for host to send question...";
        });

        conn.on('data', (payload) => {
          handleIncomingPayload(payload);
        });

        conn.on('close', () => {
          alert("Disconnected from host.");
          location.reload();
        });
      });

      peer.on('error', (err) => {
        alert("Could not connect to host. Check the Room Code and try again.");
      });
    }

    function handleIncomingPayload(payload) {
      if (payload.type === "NEW_QUESTION") {
        isTimeUp = false;
        document.getElementById("status-msg").textContent = `Question ${payload.questionIndex + 1}`;
        document.getElementById("question-text").textContent = payload.question;
        
        const badge = document.getElementById("category-badge");
        badge.textContent = payload.category;
        badge.className = `badge badge-${payload.category}`;

        renderOptions(payload.options);
      } else if (payload.type === "TIMER_SYNC") {
        if (!isTimeUp) {
          document.getElementById("status-msg").textContent = `⏱️ Time Remaining: ${payload.timeRemaining}s`;
        }
      } else if (payload.type === "TIME_UP") {
        isTimeUp = true;
        document.getElementById("status-msg").textContent = "⏱️ Time's Up!";
        disableAllOptions();
      } else if (payload.type === "LEADERBOARD_UPDATE") {
        renderLeaderboard(payload.scores);
      }
    }

    function renderOptions(options) {
      const container = document.getElementById("options-container");
      container.innerHTML = "";

      options.forEach((optText, index) => {
        const btn = document.createElement("button");
        btn.className = "btn-option";
        btn.textContent = `${String.fromCharCode(65 + index)}. ${optText}`;
        btn.onclick = () => submitAnswer(index, btn);
        container.appendChild(btn);
      });
    }

    function submitAnswer(selectedIndex, selectedBtn) {
      if (isTimeUp) return;

      disableAllOptions();
      selectedBtn.style.backgroundColor = "#007bff";
      selectedBtn.style.color = "#ffffff";

      conn.send({
        type: "SUBMIT_ANSWER",
        choiceIndex: selectedIndex
      });

      document.getElementById("status-msg").textContent = "Answer Submitted! Waiting for results...";
    }

    function disableAllOptions() {
      const buttons = document.querySelectorAll(".btn-option");
      buttons.forEach(btn => btn.disabled = true);
    }

    function renderLeaderboard(scores) {
      const el = document.getElementById("player-leaderboard");
      if (!scores || scores.length === 0) return;

      el.innerHTML = scores.map((s, idx) => `
        <div style="display:flex; justify-between; font-size: 0.9rem; margin-bottom: 4px;">
          <span><strong>#${idx + 1} ${s.name}</strong> (${s.section})</span>
          <span style="margin-left: auto;"><strong>${s.total} pts</strong></span>
        </div>
      `).join("");
    }
  </script>
</body>
</html>
