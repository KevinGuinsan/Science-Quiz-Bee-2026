<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Grade 7 Quiz Bee Host</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <script src="questions.js"></script>
  <script src="../host-app.js"></script>
  <style>
    body { font-family: sans-serif; padding: 20px; max-width: 800px; margin: auto; background: #f8f9fa; }
    .card { background: white; padding: 20px; border-radius: 8px; border: 1px solid #ddd; margin-bottom: 20px; }
    .btn { padding: 10px 18px; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; margin-right: 10px; }
    .btn-next { background: #0d6efd; color: white; }
    .btn-timer { background: #ffc107; color: black; }
    .btn-export { background: #198754; color: white; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
  </style>
</head>
<body>

  <h2>🎙️ Grade 7 Science Host Control</h2>
  
  <div class="card">
    <div>Room Code: <strong id="room-code-display" style="font-size: 1.5rem; color: #0d6efd;">----</strong> | Connected Players: <strong id="player-count-display">0</strong></div>
  </div>

  <div class="card">
    <h3 id="host-question-text">Click "Send Next Question" to begin</h3>
    <div>Timer: <strong id="timer-display" style="color: #dc3545;">--</strong></div>
    <br>
    <button class="btn btn-next" onclick="sendNextQuestion()">▶️ Send Next Question</button>
    <button id="btn-start-timer" class="btn btn-timer" onclick="startQuestionTimer()" disabled>⏱️ Start Timer</button>
    <button class="btn btn-export" onclick="exportScoresToCSV()">📊 Export Scores (CSV)</button>
  </div>

  <div class="card">
    <h3>🏆 Category Scoreboard</h3>
    <table>
      <thead>
        <tr>
          <th>Rank</th>
          <th>Participant Name</th>
          <th>Easy</th>
          <th>Moderate</th>
          <th>Difficult</th>
          <th>Total</th>
        </tr>
      </thead>
      <tbody id="leaderboard-body"></tbody>
    </table>
  </div>

</body>
</html>
