<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Grade 11 Science Quiz Bee Host</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <!-- 1. Load Grade 11 Questions -->
  <script src="questions.js"></script>
  <!-- 2. Load Core Host Engine from Root -->
  <script src="../host-app.js"></script>
  <style>
    body { font-family: -apple-system, sans-serif; padding: 20px; max-width: 800px; margin: auto; background: #f8f9fa; }
    .card { background: white; padding: 20px; border-radius: 8px; border: 1px solid #ddd; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
    .btn { padding: 10px 18px; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; margin-right: 10px; margin-bottom: 5px; }
    .btn-next { background: #0d6efd; color: white; }
    .btn-timer { background: #ffc107; color: black; }
    .btn-timer:disabled { background: #e0e0e0; color: #888; cursor: not-allowed; }
    .btn-export { background: #198754; color: white; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
    th { background: #f1f3f5; }
  </style>
</head>
<body>

  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
    <h2>🎙️ Grade 11 General Chemistry Host Control</h2>
    <a href="../index.html" style="text-decoration: none; color: #6c757d; font-weight: bold;">← Portal Menu</a>
  </div>
  
  <div class="card">
    <div>Room Code: <strong id="room-code-display" style="font-size: 1.5rem; color: #0d6efd;">----</strong> | Connected Players: <strong id="player-count-display">0</strong></div>
  </div>

  <div class="card">
    <h3 id="host-question-text">Click "Send Next Question" to begin session</h3>
    <div>Timer: <strong id="timer-display" style="color: #dc3545;">--</strong></div>
    <br>
    <button class="btn btn-next" onclick="sendNextQuestion()">▶️ Send Next Question</button>
    <button id="btn-start-timer" class="btn btn-timer" onclick="startQuestionTimer()" disabled>⏱️ Start Timer</button>
    <button class="btn btn-export" onclick="exportScoresToCSV()">📊 Export Scores (CSV)</button>
  </div>

  <div class="card">
    <h3>🏆 Category Scoreboard (Grade 11)</h3>
    <table>
      <thead>
        <tr>
          <th>Rank</th>
          <th>Participant Name</th>
          <th>Easy</th>
          <th>Moderate</th>
          <th>Difficult</th>
          <th>Total</th>
        </tr>
      </thead>
      <tbody id="leaderboard-body">
        <tr><td colspan="6" style="text-align: center; color: #6c757d;">No participants joined yet.</td></tr>
      </tbody>
    </table>
  </div>

</body>
</html>
